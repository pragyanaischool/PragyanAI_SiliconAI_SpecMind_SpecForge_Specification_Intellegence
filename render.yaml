services:
  - type: web
    name: pragyanai-specforge-api
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHROMA_DIR
        value: /var/data/chroma
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: chroma-data
      mountPath: /var/data/chroma
      sizeGB: 10
