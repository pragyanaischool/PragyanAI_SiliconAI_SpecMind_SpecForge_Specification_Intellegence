[theme]
primaryColor = "#00F2FE"
backgroundColor = "#070B12"
secondaryBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
font = "monospace"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 100
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
